<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 430" font-family="Arial, sans-serif">
  <rect width="860" height="430" fill="#ffffff"/>
  <text x="430" y="34" text-anchor="middle" font-size="20" font-weight="bold" fill="#1f4e79">Document Q&amp;A Digital Assistant — RAG Architecture</text>

  <!-- INDEXING ROW -->
  <text x="30" y="80" font-size="13" font-weight="bold" fill="#555">STEP 1 — INDEXING (run once, via ingest.py)</text>
  <rect x="30" y="92" width="150" height="60" rx="8" fill="#eaf2fb" stroke="#1f4e79"/>
  <text x="105" y="118" text-anchor="middle" font-size="13" fill="#1f2937">Your documents</text>
  <text x="105" y="136" text-anchor="middle" font-size="11" fill="#6b7280">PDF · MD · TXT</text>

  <rect x="210" y="92" width="150" height="60" rx="8" fill="#eaf2fb" stroke="#1f4e79"/>
  <text x="285" y="118" text-anchor="middle" font-size="13" fill="#1f2937">Chunk into</text>
  <text x="285" y="136" text-anchor="middle" font-size="11" fill="#6b7280">small passages</text>

  <rect x="390" y="92" width="150" height="60" rx="8" fill="#eaf2fb" stroke="#1f4e79"/>
  <text x="465" y="118" text-anchor="middle" font-size="13" fill="#1f2937">Embed → vectors</text>
  <text x="465" y="136" text-anchor="middle" font-size="11" fill="#6b7280">MiniLM model</text>

  <rect x="570" y="92" width="150" height="60" rx="8" fill="#dff3e6" stroke="#1f7a3d"/>
  <text x="645" y="118" text-anchor="middle" font-size="13" fill="#1f2937">FAISS index</text>
  <text x="645" y="136" text-anchor="middle" font-size="11" fill="#6b7280">saved to disk</text>

  <!-- arrows row 1 -->
  <g stroke="#1f4e79" stroke-width="2" fill="none" marker-end="url(#arrow)">
    <line x1="180" y1="122" x2="208" y2="122"/>
    <line x1="360" y1="122" x2="388" y2="122"/>
    <line x1="540" y1="122" x2="568" y2="122"/>
  </g>

  <!-- QUERY ROW -->
  <text x="30" y="250" font-size="13" font-weight="bold" fill="#555">STEP 2 — ANSWERING (each question, via ask.py / app.py)</text>
  <rect x="30" y="262" width="150" height="60" rx="8" fill="#fff4e5" stroke="#b26a00"/>
  <text x="105" y="288" text-anchor="middle" font-size="13" fill="#1f2937">User question</text>
  <text x="105" y="306" text-anchor="middle" font-size="11" fill="#6b7280">"How do I...?"</text>

  <rect x="210" y="262" width="150" height="60" rx="8" fill="#fff4e5" stroke="#b26a00"/>
  <text x="285" y="288" text-anchor="middle" font-size="13" fill="#1f2937">Embed question</text>
  <text x="285" y="306" text-anchor="middle" font-size="11" fill="#6b7280">same model</text>

  <rect x="390" y="262" width="150" height="60" rx="8" fill="#dff3e6" stroke="#1f7a3d"/>
  <text x="465" y="284" text-anchor="middle" font-size="13" fill="#1f2937">Retrieve top-k</text>
  <text x="465" y="302" text-anchor="middle" font-size="11" fill="#6b7280">closest chunks</text>
  <text x="465" y="316" text-anchor="middle" font-size="11" fill="#6b7280">(FAISS search)</text>

  <rect x="570" y="262" width="150" height="60" rx="8" fill="#f3e8fb" stroke="#6b21a8"/>
  <text x="645" y="284" text-anchor="middle" font-size="13" fill="#1f2937">LLM answers</text>
  <text x="645" y="302" text-anchor="middle" font-size="11" fill="#6b7280">using ONLY</text>
  <text x="645" y="316" text-anchor="middle" font-size="11" fill="#6b7280">those chunks</text>

  <!-- arrows row 2 -->
  <g stroke="#b26a00" stroke-width="2" fill="none" marker-end="url(#arrow2)">
    <line x1="180" y1="292" x2="208" y2="292"/>
    <line x1="360" y1="292" x2="388" y2="292"/>
    <line x1="540" y1="292" x2="568" y2="292"/>
  </g>

  <!-- link index to retrieve -->
  <line x1="645" y1="152" x2="645" y2="200" stroke="#1f7a3d" stroke-width="2" stroke-dasharray="5 4"/>
  <line x1="645" y1="200" x2="465" y2="200" stroke="#1f7a3d" stroke-width="2" stroke-dasharray="5 4"/>
  <line x1="465" y1="200" x2="465" y2="260" stroke="#1f7a3d" stroke-width="2" fill="none" marker-end="url(#arrow3)"/>
  <text x="470" y="196" font-size="11" fill="#1f7a3d">index is searched at query time</text>

  <!-- final output -->
  <rect x="570" y="360" width="150" height="46" rx="8" fill="#1f4e79"/>
  <text x="645" y="388" text-anchor="middle" font-size="13" font-weight="bold" fill="#ffffff">Grounded answer</text>
  <line x1="645" y1="322" x2="645" y2="358" stroke="#6b21a8" stroke-width="2" fill="none" marker-end="url(#arrow4)"/>

  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#1f4e79"/></marker>
    <marker id="arrow2" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#b26a00"/></marker>
    <marker id="arrow3" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#1f7a3d"/></marker>
    <marker id="arrow4" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#6b21a8"/></marker>
  </defs>
</svg>
